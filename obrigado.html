<body class="pagina-simples">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo topo--rolou">
    <div class="topo__interno">
      <a class="logo" href="index.html" aria-label="Raiz Odontologia, página inicial">
        <svg class="logo__dente" width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 3C5 3 3.5 4.8 3.5 7.3c0 2.4 1 4 1.6 6.4.5 2.2.9 7.3 2.5 7.3 1.5 0 1.6-4.6 4.4-4.6s2.9 4.6 4.4 4.6c1.6 0 2-5.1 2.5-7.3.6-2.4 1.6-4 1.6-6.4C20.5 4.8 19 3 16.5 3c-1.8 0-2.8 1.1-4.5 1.1S9.3 3 7.5 3z"/></svg>

      <h1 class="titulo-secao">Recebemos sua mensagem!</h1>
      <p class="obrigado__texto">Obrigado<span id="obrigado-nome"></span>. Vamos responder pelo WhatsApp em até 1 dia útil, de segunda a sábado.</p>
      <!-- ✏️ FIM -->
      <div class="obrigado__bloco">
        <h2>Quer adiantar?</h2>
        <p>Veja os horários livres e marque sua avaliação agora.</p>
        <a class="botao botao--principal botao--grande" href="index.html#agendar">Escolher meu horário</a>
      </div>
      <a class="obrigado__voltar" href="index.html">Voltar para a página inicial</a>
